services:
  # <media_service> is used to serve your media to the client devices
  <media_service>:
    image: lscr.io/linuxserver/${MEDIA_SERVICE}
    container_name: ${MEDIA_SERVICE}
    #network_mode: host # plex
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - VERSION=docker
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MEDIA_DIRECTORY}:/data
      - ${INSTALL_DIRECTORY}/config/${MEDIA_SERVICE}:/config
    ports: # plex
      - 8096:8096 # plex
    restart: unless-stopped

  # qBitorrent is used to download torrents
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:4.6.3
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - WEBUI_PORT=8081
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MEDIA_DIRECTORY}:/data
      - ${INSTALL_DIRECTORY}/config/qbittorrent:/config
    restart: unless-stopped
    ports: # qbittorrent
      - 8081:8081 # qbittorrent

  # Sonarr is used to query, add downloads to the download queue and index TV shows
  # https://sonarr.tv/
  sonarr:
    image: lscr.io/linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MEDIA_DIRECTORY}:/data
      - ${INSTALL_DIRECTORY}/config/sonarr:/config
    ports:
      - 8989:8989
    restart: unless-stopped
    networks:
      yams_network:
        ipv4_address: 172.60.0.13

  # Radarr is used to query, add downloads to the download queue and index Movies
  # https://radarr.video/
  radarr:
    image: lscr.io/linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MEDIA_DIRECTORY}:/data
      - ${INSTALL_DIRECTORY}/config/radarr:/config
    ports:
      - 7878:7878
    restart: unless-stopped
    networks:
      yams_network:
        ipv4_address: 172.60.0.14

  # Lidarr is used to query, add downloads to the download queue and index Music
  # https://lidarr.audio/
  lidarr:
    image: lscr.io/linuxserver/lidarr
    container_name: lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MEDIA_DIRECTORY}:/data
      - ${INSTALL_DIRECTORY}/config/lidarr:/config
    ports:
      - 8686:8686
    restart: unless-stopped
    networks:
      yams_network:
        ipv4_address: 172.60.0.15

  # Prowlarr is our torrent indexer/searcher. Sonarr/Radarr use Prowlarr as a source
  # https://prowlarr.com/
  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${INSTALL_DIRECTORY}/config/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    networks:
      yams_network:
        ipv4_address: 172.60.0.17

  # Byparr is a FlareSolverr-compatible proxy that bypasses Cloudflare protection for indexers
  # https://github.com/ThePhaseless/Byparr
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    ports:
      - 8191:8191
    restart: unless-stopped
    networks:
      yams_network:
        ipv4_address: 172.60.0.18

  # Dockhand helps debugging and monitors the containers
  # https://dockhand.pro/
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    ports:
      - 3000:3000
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${INSTALL_DIRECTORY}/config/dockhand:/app/data
    restart: unless-stopped
    networks:
      yams_network:
        ipv4_address: 172.60.0.19

  # Telegram bots to manage Sonarr and Radarr from Telegram (optional, enabled by the "telegram-bots" profile)
  # The images are built by GitHub Actions in your own bot repositories and published to ghcr.io
  telegram-bot-sonarr:
    image: ghcr.io/${BOT_IMAGE_OWNER}/telegram-bot-sonarr-ru:latest
    container_name: telegram-bot-sonarr
    profiles: ["telegram-bots"]
    mem_limit: 128M
    depends_on:
      - sonarr
    environment:
      - SBOT_TELEGRAM_BOT_TOKEN=${SONARR_BOT_TOKEN}
      - SBOT_BOT_ALLOWED_USERIDS=${BOT_ALLOWED_USERIDS}
      - SBOT_BOT_MAX_ITEMS=10
      - SBOT_BOT_IGNORE_TAGS=false
      - SBOT_SONARR_PROTOCOL=http
      - SBOT_SONARR_HOSTNAME=sonarr
      - SBOT_SONARR_PORT=8989
      - SBOT_SONARR_API_KEY=${SONARR_API_KEY}
    restart: unless-stopped
    networks:
      yams_network:
        ipv4_address: 172.60.0.21

  telegram-bot-radarr:
    image: ghcr.io/${BOT_IMAGE_OWNER}/telegram-bot-radarr-ru:latest
    container_name: telegram-bot-radarr
    profiles: ["telegram-bots"]
    mem_limit: 128M
    depends_on:
      - radarr
    environment:
      - RBOT_TELEGRAM_BOT_TOKEN=${RADARR_BOT_TOKEN}
      - RBOT_BOT_ALLOWED_USERIDS=${BOT_ALLOWED_USERIDS}
      - RBOT_BOT_MAX_ITEMS=10
      - RBOT_BOT_IGNORE_TAGS=false
      - RBOT_RADARR_PROTOCOL=http
      - RBOT_RADARR_HOSTNAME=radarr
      - RBOT_RADARR_PORT=7878
      - RBOT_RADARR_API_KEY=${RADARR_API_KEY}
    restart: unless-stopped
    networks:
      yams_network:
        ipv4_address: 172.60.0.22

  # Watchtower is going to keep our instances updated
  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    environment:
      - WATCHTOWER_CLEANUP=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      yams_network:
        ipv4_address: 172.60.0.20

networks:
  yams_network:
    name: yams_network
    ipam:
      config:
        - subnet: 172.60.0.0/24
